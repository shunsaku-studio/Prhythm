<section data-label="サマリー" class="s-content">
  <div class="grid-bg"></div>
  <div class="frame">
    <div class="head">
      <div class="eyebrow anim d1">Summary</div>
      <h2 class="ttl-jp anim d1">サマリー</h2>
    </div>
    <div class="grad-rule anim d2"></div>

    <div class="anim d3" style="flex:1;display:flex;flex-direction:column;margin-top:12px;min-height:0;gap:0;">

      <div style="flex:1;display:flex;flex-direction:column;min-height:0;">
        <div style="font-family:var(--mono);font-size:16px;font-weight:900;letter-spacing:0.14em;color:var(--primary);flex-shrink:0;">今日伝えること</div>

        <div style="flex:1;display:flex;flex-direction:column;margin-top:4px;min-height:0;">
          <div style="flex:1;display:grid;grid-template-columns:132px minmax(0,1fr);gap:28px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-strong);">
            <div>
              <div class="tnum" style="color:var(--primary);">01</div>
              <div style="font-family:var(--mono);font-size:16px;font-weight:900;letter-spacing:0.14em;color:var(--primary);margin-top:4px;">WHAT</div>
            </div>
            <div>
              <div style="font-size:20px;line-height:1.35;color:var(--ink-2);font-weight:700;">提案瞬作のためのスキルセット</div>
              <div style="margin-top:6px;font-size:34px;font-weight:900;line-height:1.25;letter-spacing:-0.02em;"><span class="g-text">Prhythm（プリズム）</span>を作ってきた</div>
            </div>
          </div>

          <div style="flex:1.1;display:grid;grid-template-columns:132px minmax(0,1fr);gap:28px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-strong);">
            <div>
              <div class="tnum" style="color:var(--primary);">02</div>
              <div style="font-family:var(--mono);font-size:16px;font-weight:900;letter-spacing:0.14em;color:var(--primary);margin-top:4px;">HOW</div>
            </div>
            <div>
              <div style="font-size:20px;line-height:1.35;color:var(--ink-2);font-weight:700;">Prhythm は、</div>
              <div style="margin-top:6px;font-size:34px;font-weight:900;line-height:1.25;letter-spacing:-0.02em;">プロダクトを<span class="g-text">多面的に捉える</span></div>
              <div class="chips" style="margin-top:10px;gap:8px;align-items:center;">
                <span style="display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border:1.5px solid var(--line-strong);font-family:'Noto Sans JP',sans-serif;font-size:16px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:0.04em;">ビジネス</span>
                <span style="display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border:1.5px solid var(--line-strong);font-family:'Noto Sans JP',sans-serif;font-size:16px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:0.08em;">UX</span>
                <span style="display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border:1.5px solid var(--line-strong);font-family:'Noto Sans JP',sans-serif;font-size:16px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:0.04em;">開発</span>
                <span style="display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border:1.5px solid var(--line-strong);font-family:'Noto Sans JP',sans-serif;font-size:16px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:0.04em;">実行計画</span>
              </div>
            </div>
          </div>

          <div style="flex:1;display:grid;grid-template-columns:132px minmax(0,1fr);gap:28px;align-items:center;padding:12px 0 8px;">
            <div>
              <div class="tnum" style="color:var(--primary);">03</div>
              <div style="font-family:var(--mono);font-size:16px;font-weight:900;letter-spacing:0.14em;color:var(--primary);margin-top:4px;">WHY</div>
            </div>
            <div>
              <div style="font-size:20px;line-height:1.35;color:var(--ink-2);font-weight:700;">Prhythm を使うチームは、</div>
              <div style="margin-top:6px;font-size:34px;font-weight:900;line-height:1.25;letter-spacing:-0.02em;">曖昧な課題感を、<span class="g-text">顧客が判断でき受注後に動ける提案</span>に変える</div>
            </div>
          </div>
        </div>
      </div>

      <div style="flex-shrink:0;margin-top:20px;margin-bottom:24px;border:2px solid var(--ink);background:var(--paper);padding:28px 36px;">
        <div style="font-family:var(--mono);font-size:16px;font-weight:900;letter-spacing:0.14em;color:var(--primary);">今日持ち帰ってほしいこと</div>
        <div style="margin-top:12px;font-size:34px;font-weight:900;line-height:1.35;letter-spacing:-0.02em;">自分の案件ならどこで使うかを持てるようにする</div>
      </div>

    </div>

    <div class="pagefoot anim d4"><span>瞬作スタジオ / Prhythm Horizon紹介</span><span>02</span></div>
  </div>
</section>
