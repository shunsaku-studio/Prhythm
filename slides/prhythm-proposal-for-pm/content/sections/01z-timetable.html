<section data-label="タイムテーブル" class="s-content">
  <div class="grid-bg"></div>
  <div class="frame">
    <div class="head">
      <div class="eyebrow anim d1">Agenda</div>
      <h2 class="ttl-jp anim d1">今日の進め方</h2>
    </div>
    <p class="lead anim d2">まずはPrhythmの背景とPMとの接点を共有し、そのあと皆さんとディスカッションします。</p>

    <div class="anim d3" style="display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);align-items:stretch;flex:1;min-height:0;margin-top:58px;">
      <div style="border-top:3px solid var(--ink);padding:30px 44px 0 0;display:flex;flex-direction:column;">
        <div style="font-family:var(--mono);font-size:22px;letter-spacing:.12em;color:var(--ink-3);">01 / INTRODUCTION</div>
        <div style="margin-top:14px;font-size:42px;font-weight:900;line-height:1.2;">導入・説明</div>
        <div style="display:flex;align-items:baseline;gap:16px;margin-top:26px;">
          <strong style="font-family:var(--mono);font-size:92px;line-height:.9;letter-spacing:-.06em;">25</strong>
          <span style="font-size:30px;font-weight:800;">分</span>
        </div>
        <p style="margin:28px 0 0;font-size:24px;line-height:1.55;color:var(--ink-2);">Prhythmの背景、PMとの接点、提案での使い方を全体像から紹介します。</p>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:var(--primary);">→</div>
      <div style="border-top:3px solid var(--primary);padding:30px 0 0 44px;display:flex;flex-direction:column;background:linear-gradient(180deg,color-mix(in oklch,var(--primary) 6%,var(--paper)) 0%,var(--paper) 78%);">
        <div style="font-family:var(--mono);font-size:22px;letter-spacing:.12em;color:var(--primary);">02 / DISCUSSION</div>
        <div style="margin-top:14px;font-size:42px;font-weight:900;line-height:1.2;">ディスカッション</div>
        <p style="margin:38px 0 0;font-size:27px;line-height:1.55;font-weight:700;">気になった点や、PMとして活用できそうな場面を一緒に考えます。</p>
        <div style="margin-top:auto;padding:18px 24px;border-left:5px solid var(--primary);background:var(--subtle);font-size:23px;line-height:1.45;color:var(--ink-2);">問いを持ち寄り、次に試したいことを見つける時間</div>
      </div>
    </div>

    <div class="pagefoot anim d4"><span>瞬作スタジオ / Prhythm PM紹介</span><span>02</span></div>
  </div>
</section>
