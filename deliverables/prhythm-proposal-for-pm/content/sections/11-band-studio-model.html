<section data-label="バンドスタジオモデル" class="s-content">
  <div class="grid-bg"></div>
  <div class="frame">
    <div class="head">
      <div class="eyebrow anim d1">Organization</div>
      <h2 class="ttl-jp anim d1">そもそもバンドスタジオモデルとは</h2>
    </div>
    <p class="lead anim d2">1バンド=実質PdM として、各プロダクトにコアバンドが配置され、スタジオは後方支援する。スタジオが品質の床を上げ、バンドが品質の天井を上げる。</p>
    <div class="anim d3" style="flex:1;display:flex;flex-direction:column;gap:16px;margin-top:24px;min-height:0;">

      <div style="flex:1;border:3px solid var(--ink);padding:40px 48px 36px;background:var(--paper);display:flex;flex-direction:column;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:32px;margin-bottom:16px;">
            <div style="font-weight:900;font-size:32px;letter-spacing:-0.02em;line-height:1.1;">アカウント（顧客）</div>

        </div>

        <div style="flex:1;border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;">
          <div style="padding:32px 36px 24px 0;border-right:1px solid var(--line-strong);text-align:center;display:flex;flex-direction:column;">
            <div class="tnum" style="text-align:left;">A</div>
            <div style="font-weight:900;font-size:34px;margin-top:12px;">業務システム</div>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:var(--ink-3);">↕</div>
            <div style="font-weight:900;font-size:30px;border-top:1px solid var(--line-strong);padding-top:24px;">Band A</div>
          </div>
          <div style="padding:32px 36px 24px;border-right:1px solid var(--line-strong);text-align:center;display:flex;flex-direction:column;">
            <div class="tnum" style="text-align:left;">B</div>
            <div style="font-weight:900;font-size:34px;margin-top:12px;">toCアプリ</div>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:var(--ink-3);">↕</div>
            <div style="font-weight:900;font-size:30px;border-top:1px solid var(--line-strong);padding-top:24px;">Band B</div>
          </div>
          <div style="padding:32px 0 24px 36px;text-align:center;display:flex;flex-direction:column;">
            <div class="tnum" style="text-align:left;">C</div>
            <div style="font-weight:900;font-size:34px;margin-top:12px;">データ基盤 等</div>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:var(--ink-3);">↕</div>
            <div style="font-weight:900;font-size:30px;border-top:1px solid var(--line-strong);padding-top:24px;">Band C</div>
          </div>
        </div>
        <div class="note" style="text-align:center;margin-top:24px;font-size:22px;">1バンド（固定チーム） = 実質 PdM として文脈を深く共有</div>
      </div>

      <div style="flex-shrink:0;padding-bottom:4px;">
        <div style="font-family:var(--mono);font-size:26px;color:var(--ink-3);letter-spacing:0.06em;text-align:center;margin-bottom:20px;">↑ スタジオ → バンドへ「スキル・仕組みを供給」</div>
        <div class="chips" style="justify-content:center;gap:18px;flex-wrap:nowrap;">
          <span class="chip" style="border:2px solid transparent;font-weight:900;font-size:28px;padding:20px 36px;color:var(--paper);background:var(--grad);white-space:nowrap;">★ 瞬作スタジオ</span>
          <span class="chip" style="border:2px solid transparent;font-weight:700;font-size:26px;padding:20px 32px;color:var(--paper);background:var(--grad);white-space:nowrap;">ECスタジオ</span>
          <span class="chip" style="border:2px solid transparent;font-weight:700;font-size:26px;padding:20px 32px;color:var(--paper);background:var(--grad);white-space:nowrap;">デザインシステムスタジオ</span>
          <span class="chip" style="border:2px solid transparent;font-weight:700;font-size:26px;padding:20px 32px;color:var(--paper);background:var(--grad);white-space:nowrap;">a11yスタジオ</span>
          <span class="chip" style="border:2px solid transparent;font-weight:700;font-size:26px;padding:20px 32px;color:var(--paper);background:var(--grad);">…</span>
        </div>
      </div>
    </div>
    <div class="pagefoot anim d4"><span>瞬作スタジオ / Prhythm MD紹介</span><span>A1</span></div>
  </div>
</section>
